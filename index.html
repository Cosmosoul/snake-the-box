<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snack the Box</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#e8e8e8;font-family:'Courier New',monospace;user-select:none}
#gameCanvas{display:block;position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}

#titleScreen{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .5s}
#titleScreen.hidden{opacity:0;pointer-events:none}
.title-player{width:80px;height:80px;background:#f2ede4;border:3px solid #0a0806;border-radius:8px;position:relative;margin-bottom:40px;animation:floatY 2s ease-in-out infinite;box-shadow:0 4px 0 rgba(0,0,0,.5),inset -4px -4px 0 rgba(0,0,0,.08),inset 4px 4px 0 rgba(255,255,255,.4)}
.title-player .eye{position:absolute;width:18px;height:18px;background:#0a0806;border-radius:50%;top:26px}
.title-player .eye-l{left:18px}
.title-player .eye-r{right:18px}
.title-player .eye::after{content:'';position:absolute;width:6px;height:6px;background:#fff;border-radius:50%;top:3px;left:3px}
.title-letters{font-family:'Courier New',monospace;font-size:clamp(24px,5vw,56px);font-weight:bold;color:#f2ede4;letter-spacing:4px;text-shadow: none !important;text-align:center;line-height:1.2}
.title-letters span{display:inline-block;animation:floatUp 2s ease-in-out infinite}
.title-letters .sp{width:.4em;animation:none}
.title-letters span:nth-child(1){animation-delay:0s}
.title-letters span:nth-child(2){animation-delay:.08s}
.title-letters span:nth-child(3){animation-delay:.16s}
.title-letters span:nth-child(4){animation-delay:.24s}
.title-letters span:nth-child(5){animation-delay:.32s}
.title-letters span:nth-child(7){animation-delay:.4s}
.title-letters span:nth-child(8){animation-delay:.48s}
.title-letters span:nth-child(9){animation-delay:.56s}
.title-letters span:nth-child(11){animation-delay:.64s}
.title-letters span:nth-child(12){animation-delay:.72s}
.title-letters span:nth-child(13){animation-delay:.8s}
.title-hint{margin-top:60px;color:#666;font-family:'Courier New',monospace;font-size:14px;letter-spacing:3px;animation:pulse 2s ease-in-out infinite}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes floatUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

#hud{position:fixed;inset:0;pointer-events:none;z-index:50;display:none}
#hud.active{display:block}
.hud-panel{position:absolute;background:rgba(10,15,26,.9);border:none;border-radius:0;padding:8px 14px;color:#aac4d6;font-size:13px;box-shadow:inset -3px -3px 0 rgba(0,0,0,.5),inset 3px 3px 0 rgba(255,255,255,.08),3px 3px 0 rgba(0,0,0,.6);image-rendering:pixelated}
#hudSteps{top:12px;left:12px}
#hudSteps .v{color:#00ffaa;font-weight:bold;font-size:16px;margin-left:4px}
#hudTargets{top:12px;left:50%;transform:translateX(-50%)}
#hudTargets .v{color:#ffaa00;font-weight:bold;font-size:16px;margin-left:4px}
#hudMinimap{top:12px;right:12px;padding:6px}
#hudMinimap canvas{display:block;width:140px;height:100px;image-rendering:pixelated}
#hudHint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);color:#4a5a6a;font-size:11px;letter-spacing:1px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal.active{display:flex}
.modal-box{background:#1a1f2a;border:none;border-radius:0;padding:24px;max-width:min(900px,92vw);width:100%;max-height:88vh;display:flex;flex-direction:column;gap:14px;overflow-y:auto;box-shadow:inset -4px -4px 0 rgba(0,0,0,.5),inset 4px 4px 0 rgba(255,255,255,.08),0 0 0 2px #0a0e1a,0 0 0 5px #3a5a7a,0 0 0 7px #0a0e1a,10px 10px 0 0 rgba(0,0,0,.7);image-rendering:pixelated;position:relative}
.modal-box h2{color:#00ffaa;font-size:18px;font-weight:bold;letter-spacing:3px;border-bottom:2px solid #3a5a7a;padding-bottom:10px;text-shadow: none !important;margin:0}
.modal-hint{font-size:13px;color:#7a8a9a;line-height:1.8}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
button{background:#2a3a4a;border:none;color:#e8e8e8;font-family:inherit;font-size:13px;padding:10px 18px;border-radius:0;cursor:pointer;min-height:36px;font-weight:bold;letter-spacing:1px;box-shadow:inset -3px -3px 0 rgba(0,0,0,.4),inset 3px 3px 0 rgba(255,255,255,.15),3px 3px 0 rgba(0,0,0,.6);image-rendering:pixelated}
button:hover{background:#3a5a7a;color:#fff}
button.primary{background:#1a8a4a;color:#fff;font-weight:bold}
button.primary:hover{background:#2a9a5a}
button.danger{background:#8a2a3a;color:#fff}
button.danger:hover{background:#9a3a4a}

#levelGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.level-card{background:#1a1f2a;border:none;border-radius:0;padding:12px;cursor:pointer;position:relative;box-shadow:inset -3px -3px 0 rgba(0,0,0,.4),inset 3px 3px 0 rgba(255,255,255,.08),3px 3px 0 rgba(0,0,0,.6);image-rendering:pixelated}
.level-card:hover:not(.locked){background:#222a3a;transform:translate(-1px,-1px);box-shadow:inset -3px -3px 0 rgba(0,0,0,.4),inset 3px 3px 0 rgba(255,255,255,.15),3px 3px 0 rgba(0,0,0,.6),0 0 20px rgba(0,255,170,.35)}
.level-card.locked{opacity:.4;cursor:not-allowed}
.level-card .thumb{width:100%;aspect-ratio:1;background:#060810;border:none;border-radius:0;margin-bottom:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:inset 2px 2px 0 rgba(0,0,0,.6),inset -2px -2px 0 rgba(255,255,255,.06)}
.level-card .thumb img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.level-card .thumb .lock{font-size:32px;color:#3a4a5a}
.level-card .info{font-size:12px;color:#aac4d6}
.level-card .info .id{color:#00ffaa;font-weight:bold;font-size:14px;margin-bottom:4px}
.level-card .info .best{color:#7a8a9a;font-size:11px}
.level-card .info .best b{color:#ffaa00}

.slider-row{display:flex;align-items:center;gap:12px;padding:8px 0}
.slider-row label{color:#7a8a9a;width:80px;font-size:13px}
.slider-row input[type=range]{flex:1;height:14px;background:#0f1420;border:none;border-radius:0;outline:none;-webkit-appearance:none;appearance:none;box-shadow:inset 2px 2px 0 rgba(0,0,0,.6),inset -2px -2px 0 rgba(255,255,255,.08)}
.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:22px;background:#00ffaa;border-radius:0;cursor:pointer;box-shadow:inset -2px -2px 0 rgba(0,0,0,.4),inset 2px 2px 0 rgba(255,255,255,.4),2px 2px 0 rgba(0,0,0,.6);border:2px solid #0a0e1a}
.slider-row input[type=range]::-moz-range-thumb{width:16px;height:22px;background:#00ffaa;border-radius:0;cursor:pointer;border:2px solid #0a0e1a;box-shadow:inset -2px -2px 0 rgba(0,0,0,.4),inset 2px 2px 0 rgba(255,255,255,.4)}
.slider-row .val{color:#00ffaa;width:40px;text-align:right;font-weight:bold;font-size:13px}

.result-screen{text-align:center;padding:24px}
.result-screen h2{font-size:32px;letter-spacing:6px;margin-bottom:16px;font-weight:bold;border:none;padding:0}
.result-screen.win h2{color:#00ffaa;text-shadow: none !important;text-shadow: none !important;font-size:14px;margin-bottom:24px;line-height:1.8}
.result-screen .stats b{color:#00ffaa;font-size:18px}
.result-screen .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

#mapOverlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
#mapOverlay.active{display:flex}
#mapOverlay canvas{display:block;background:#060810;border:none;border-radius:0;max-width:92vw;max-height:88vh;image-rendering:pixelated;box-shadow:0 0 0 2px #0a0e1a,0 0 0 5px #3a5a7a,0 0 0 7px #0a0e1a,10px 10px 0 0 rgba(0,0,0,.7)}

/* ============================================================
   手绘像素风 UI 覆盖 (fix4)
   ============================================================ */
:root {
  --ink: #2a1a0a;
  --ink-soft: #4a3a2a;
  --ink-mute: #6a5a4a;
  --paper: #f5ecd5;
  --paper-light: #fbf4e3;
  --paper-dark: #e8d9b0;
  --paper-shade: #d8c9a0;
  --accent: #a84020;
  --accent-green: #2a6a1a;
  --accent-blue: #2a4a7a;
  --hard-shadow: 4px 4px 0 rgba(42,26,10,.85);
}

/* ---- 字体全局重置 ---- */
html, body {
  font-family: 'Trebuchet MS', 'Verdana', Tahoma, sans-serif !important;
  -webkit-font-smoothing: antialiased;
}

/* ---- Shader 1: 噪点 (SVG feTurbulence) ---- */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9998;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.12  0 0 0 0 0.08  0 0 0 0 0.04  0 0 0 0.55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  opacity: 0.14;
  mix-blend-mode: multiply;
}

/* ---- Shader 2: 扫描线 ---- */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9997;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px,
    transparent 2px,
    rgba(0,0,0,.055) 2px,
    rgba(0,0,0,.055) 3px
  );
}

/* ---- Shader 3: 画布边缘暗角 ---- */
#gameCanvas {
  filter: saturate(1.05) contrast(1.03) !important;
}

/* ============================================================
   启动页标题 - 加强字重、字距，去掉 AI 感
   ============================================================ */
.title-letters {
  font-family: 'Trebuchet MS', 'Verdana', sans-serif !important;
  font-weight: 900 !important;
  font-size: clamp(30px, 6vw, 68px) !important;
  letter-spacing: 10px !important;
  color: #f4e9d0 !important;
  text-shadow: none !important;
  padding-left: 10px !important;
}
.title-hint {
  font-family: 'Trebuchet MS', sans-serif !important;
  font-weight: 700 !important;
  font-size: 13px !important;
  letter-spacing: 5px !important;
  color: #aac4d6 !important;
}

/* ============================================================
   Modal - 手绘纸卡
   ============================================================ */
.modal {
  background: rgba(10, 8, 6, .9) !important;
}

.modal-box {
  background-color: var(--paper) !important;
  background-image:
    radial-gradient(circle at 15% 20%, rgba(180,140,80,.13) 0%, transparent 40%),
    radial-gradient(circle at 85% 78%, rgba(180,140,80,.09) 0%, transparent 45%),
    repeating-linear-gradient(45deg, rgba(160,120,60,.025) 0px, rgba(160,120,60,.025) 2px, transparent 2px, transparent 8px),
    repeating-linear-gradient(-45deg, rgba(160,120,60,.02) 0px, rgba(160,120,60,.02) 1px, transparent 1px, transparent 11px) !important;
  border: 3px solid var(--ink) !important;
  border-radius: 2px !important;
  padding: 26px 24px 22px !important;
  box-shadow:
    6px 6px 0 rgba(42,26,10,.85),
    inset -4px -4px 0 rgba(0,0,0,.07),
    inset 4px 4px 0 rgba(255,255,255,.55) !important;
  outline: 2px dashed rgba(42,26,10,.32) !important;
  outline-offset: 4px !important;
  color: var(--ink) !important;
  position: relative !important;
  font-family: 'Trebuchet MS', sans-serif !important;
}

.modal-box h2 {
  font-family: 'Georgia', 'Times New Roman', serif !important;
  font-weight: 900 !important;
  font-size: 22px !important;
  letter-spacing: 3px !important;
  color: var(--ink) !important;
  border-bottom: none !important;
  padding: 0 0 14px 0 !important;
  margin: 0 !important;
  position: relative !important;
  text-shadow: none !important;
}
.modal-box h2::after {
  content: '' !important;
  position: absolute !important;
  bottom: 4px !important;
  left: -2px !important;
  right: -2px !important;
  height: 3px !important;
  background: var(--ink) !important;
  transform: none !important;
  border-radius: 1px !important;
  opacity: .9 !important;
}

.modal-hint {
  color: var(--ink-soft) !important;
  font-family: 'Trebuchet MS', sans-serif !important;
  font-size: 13.5px !important;
  line-height: 1.9 !important;
  letter-spacing: .2px !important;
}
.modal-hint b {
  color: var(--accent) !important;
  font-weight: 900 !important;
}

/* ============================================================
   Button - 手绘凸起按钮
   ============================================================ */
button {
  background: var(--paper-dark) !important;
  color: var(--ink) !important;
  border: 2px solid var(--ink) !important;
  border-radius: 2px !important;
  font-family: 'Trebuchet MS', sans-serif !important;
  font-weight: 700 !important;
  font-size: 13px !important;
  letter-spacing: 1.2px !important;
  padding: 8px 18px !important;
  min-height: 36px !important;
  box-shadow:
    3px 3px 0 var(--ink),
    inset -2px -2px 0 rgba(0,0,0,.12),
    inset 2px 2px 0 rgba(255,255,255,.42) !important;
  transition: none !important;
  image-rendering: pixelated;
  cursor: pointer;
}
button:hover {
  background: var(--paper-light) !important;
  color: var(--ink) !important;
  box-shadow:
    4px 4px 0 var(--ink),
    inset -2px -2px 0 rgba(0,0,0,.12),
    inset 2px 2px 0 rgba(255,255,255,.5) !important;
  transform: translate(-1px, -1px) !important;
}
button:active {
  box-shadow:
    1px 1px 0 var(--ink),
    inset 2px 2px 0 rgba(0,0,0,.18),
    inset -2px -2px 0 rgba(255,255,255,.3) !important;
  transform: translate(2px, 2px) !important;
}
button:disabled {
  opacity: .45 !important;
  cursor: not-allowed !important;
  transform: none !important;
}
button.primary {
  background: #8ac87a !important;
  color: #1a2a10 !important;
}
button.primary:hover { background: #a0d890 !important; }
button.danger {
  background: #d8706a !important;
  color: #2a0806 !important;
}
button.danger:hover { background: #e8807a !important; }

/* ============================================================
   HUD - 手绘标签
   ============================================================ */
.hud-panel {
  background: var(--paper) !important;
  color: var(--ink) !important;
  border: 2px solid var(--ink) !important;
  border-radius: 2px !important;
  padding: 6px 12px !important;
  font-family: 'Trebuchet MS', sans-serif !important;
  font-weight: 700 !important;
  font-size: 13px !important;
  letter-spacing: .5px !important;
  box-shadow:
    3px 3px 0 rgba(42,26,10,.85),
    inset -2px -2px 0 rgba(0,0,0,.08),
    inset 2px 2px 0 rgba(255,255,255,.5) !important;
  backdrop-filter: none !important;
}
#hudSteps .v,
#hudTargets .v {
  color: var(--accent) !important;
  font-family: 'Georgia', 'Times New Roman', serif !important;
  font-weight: 900 !important;
  font-size: 17px !important;
}
#hudMinimap {
  padding: 8px !important;
}

/* ============================================================
   关卡卡片 - 手绘纸卡
   ============================================================ */
.level-card {
  background-color: var(--paper) !important;
  background-image:
    radial-gradient(circle at 30% 20%, rgba(180,140,80,.12) 0%, transparent 50%),
    repeating-linear-gradient(45deg, rgba(160,120,60,.025) 0px, rgba(160,120,60,.025) 2px, transparent 2px, transparent 8px) !important;
  border: 2px solid var(--ink) !important;
  border-radius: 2px !important;
  padding: 12px !important;
  color: var(--ink) !important;
  box-shadow:
    4px 4px 0 rgba(42,26,10,.85),
    inset -2px -2px 0 rgba(0,0,0,.07),
    inset 2px 2px 0 rgba(255,255,255,.5) !important;
  transition: none !important;
}
.level-card:hover:not(.locked) {
  background-color: var(--paper-light) !important;
  transform: translate(-2px, -2px) !important;
  box-shadow:
    6px 6px 0 rgba(42,26,10,.85),
    inset -2px -2px 0 rgba(0,0,0,.07),
    inset 2px 2px 0 rgba(255,255,255,.55),
    0 0 24px rgba(255,200,120,.3) !important;
}
.level-card.locked { opacity: .5; }
.level-card .thumb {
  background: #0a0806 !important;
  border: 2px solid var(--ink) !important;
  border-radius: 1px !important;
  box-shadow:
    inset 0 0 14px rgba(0,0,0,.85),
    inset 2px 2px 0 rgba(0,0,0,.6) !important;
}
.level-card .info { color: var(--ink-soft) !important; }
.level-card .info .id {
  color: var(--accent) !important;
  font-family: 'Georgia', 'Times New Roman', serif !important;
  font-weight: 900 !important;
  font-size: 15px !important;
  letter-spacing: 1px !important;
  text-shadow: none !important;
}
.level-card .info .best {
  color: var(--ink-mute) !important;
  font-weight: 600;
}
.level-card .info .best b {
  color: var(--accent-green) !important;
  font-family: 'Georgia', serif !important;
  font-weight: 900;
}

/* ============================================================
   Slider
   ============================================================ */
.slider-row label {
  color: var(--ink-soft) !important;
  font-family: 'Trebuchet MS', sans-serif !important;
  font-weight: 700 !important;
  letter-spacing: .5px;
}
.slider-row input[type=range] {
  background: var(--paper-dark) !important;
  border: 2px solid var(--ink) !important;
  border-radius: 0 !important;
  height: 14px !important;
  box-shadow:
    inset 2px 2px 0 rgba(0,0,0,.15),
    inset -2px -2px 0 rgba(255,255,255,.3) !important;
  -webkit-appearance: none;
  appearance: none;
}
.slider-row input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none !important;
  width: 18px !important;
  height: 24px !important;
  background: var(--accent) !important;
  border: 2px solid var(--ink) !important;
  border-radius: 0 !important;
  cursor: pointer;
  box-shadow:
    2px 2px 0 var(--ink),
    inset -1px -1px 0 rgba(0,0,0,.3),
    inset 1px 1px 0 rgba(255,255,255,.3) !important;
}
.slider-row input[type=range]::-moz-range-thumb {
  width: 18px !important;
  height: 24px !important;
  background: var(--accent) !important;
  border: 2px solid var(--ink) !important;
  border-radius: 0 !important;
}
.slider-row .val {
  color: var(--accent) !important;
  font-family: 'Georgia', serif !important;
  font-weight: 900 !important;
}

/* ============================================================
   结果页 - 手绘标题
   ============================================================ */
.result-screen h2 {
  font-family: 'Georgia', 'Times New Roman', serif !important;
  font-weight: 900 !important;
  font-size: 42px !important;
  letter-spacing: 8px !important;
}
.result-screen.win h2 {
  color: var(--accent-green) !important;
  text-shadow: none !important;
  transform: rotate(-1.5deg);
}
.result-screen.lose h2 {
  color: var(--accent) !important;
  text-shadow: none !important;
  transform: rotate(1.5deg);
}
.result-screen .stats {
  color: var(--ink-soft) !important;
  font-family: 'Trebuchet MS', sans-serif !important;
}
.result-screen .stats b {
  color: var(--accent) !important;
  font-family: 'Georgia', serif !important;
  font-weight: 900 !important;
}

/* ============================================================
   大地图
   ============================================================ */
#mapOverlay {
  background: rgba(10, 8, 6, .93) !important;
}
#mapOverlay canvas {
  border: 3px solid var(--ink) !important;
  border-radius: 2px !important;
  box-shadow:
    6px 6px 0 rgba(42,26,10,.85),
    0 0 40px rgba(0,0,0,.6) !important;
}


/* ============================================================
   CRT 老电视效果 + UI 暗色调 (v5)
   ============================================================ */

/* --- 调暗 UI 色调，文字对比仍清晰 --- */
:root {
  --paper: #c8ba96;
  --paper-light: #d4c8a4;
  --paper-dark: #a89a78;
  --paper-shade: #8a7c5a;
  --ink: #0a0600;
  --ink-soft: #1a0e04;
  --ink-mute: #3a2818;
  --accent: #8a2a10;
  --accent-green: #225a14;
  --accent-blue: #223a6a;
}

/* --- Modal 暗纸 --- */
.modal {
  background: rgba(6, 5, 4, .93) !important;
}
.modal-box {
  background-color: var(--paper) !important;
  border-color: #0a0600 !important;
  box-shadow:
    6px 6px 0 rgba(10,6,2,.9),
    inset -4px -4px 0 rgba(0,0,0,.1),
    inset 4px 4px 0 rgba(255,255,255,.3) !important;
  outline-color: rgba(10,6,0,.26) !important;
  color: var(--ink) !important;
}
.modal-box h2 { color: var(--ink) !important; }
.modal-box h2::after { background: var(--ink) !important; }
.modal-hint { color: var(--ink-soft) !important; }
.modal-hint b { color: var(--accent) !important; }

/* --- HUD 暗纸 --- */

<script>
'use strict';

const CELL = 80;
const COLOR_HEX = {white:'#f2ede4',blue:'#5a9ae0',red:'#e05555',green:'#5cc668',purple:'#b065d8',orange:'#f0a030',black:'#3a3a3a'};
const DIRS = {up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const clone = o => JSON.parse(JSON.stringify(o));

const Save = {
  KEY: 'snack_the_box_v1',
  data: {unlocked:1, bestSteps:{}, musicVol:0.5, sfxVol:0.5},
  load(){
    try{
      const d = JSON.parse(localStorage.getItem(this.KEY) || 'null');
      if(d && typeof d === 'object') this.data = Object.assign(this.data, d);
    }catch(e){}
  },
  save(){ try{ localStorage.setItem(this.KEY, JSON.stringify(this.data)); }catch(e){} },
  unlockAfter(i){
    const need = i + 2;
    if((this.data.unlocked || 1) < need){ this.data.unlocked = need; this.save(); }
  },
  setBest(i, s){
    const cur = this.data.bestSteps[i];
    if(cur === undefined || s < cur){ this.data.bestSteps[i] = s; this.save(); return true; }
    return false;
  }
};
Save.load();

const AUDIO = {
  ctx: null, master: null, musicGain: null, sfxGain: null,
  musicType: null, musicStep: 0, nextNoteTime: 0, musicTimer: null,
  init(){
    if(this.ctx) return;
    try{
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.comp = this.ctx.createDynamicsCompressor();
      this.comp.threshold.value = -8;
      this.comp.knee.value = 6;
      this.comp.ratio.value = 12;
      this.comp.attack.value = 0.003;
      this.comp.release.value = 0.25;
      this.comp.connect(this.ctx.destination);
      this.master = this.ctx.createGain();
      this.master.gain.value = 2.4;
      this.master.connect(this.comp);
      this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = Save.data.musicVol; this.musicGain.connect(this.master);
      this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = Save.data.sfxVol; this.sfxGain.connect(this.master);
    }catch(e){ console.warn('Audio init failed', e); }
  },
  resume(){ this.init(); if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setMusicVol(v){ Save.data.musicVol = v; Save.save(); if(this.musicGain) this.musicGain.gain.value = v; },
  setSfxVol(v){ Save.data.sfxVol = v; Save.save(); if(this.sfxGain) this.sfxGain.gain.value = v; },
  playNote(freq, dur, type, vol, delay, dest){
    if(!this.ctx) return;
    const t = this.ctx.currentTime + (delay || 0);
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol || 0.1, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(g); g.connect(dest || this.sfxGain);
    osc.start(t); osc.stop(t + dur + 0.05);
  },
  sfxClick(){ this.resume(); this.playNote(660,0.06,'triangle',0.12); this.playNote(880,0.05,'sine',0.08,0.02); },
  sfxStep(){ this.playNote(180,0.03,'sine',0.03); },
  sfxPush(){ this.resume(); this.playNote(140,0.12,'sine',0.12); this.playNote(110,0.15,'sine',0.08,0.02); },
  sfxBean(){ this.resume(); this.playNote(880,0.08,'sine',0.09); this.playNote(1320,0.1,'sine',0.07,0.05); },
  sfxPortal(){ this.resume(); this.playNote(400,0.05,'sine',0.08); this.playNote(800,0.2,'sine',0.1,0.03); this.playNote(1200,0.15,'sine',0.06,0.08); },
  sfxUndo(){ this.resume(); this.playNote(500,0.08,'sine',0.07); this.playNote(350,0.12,'sine',0.06,0.05); },
  sfxWin(){ this.resume(); [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>this.playNote(f,0.35,'triangle',0.14,i*0.1)); },
  sfxLose(){ this.resume(); [440,392,330,262].forEach((f,i)=>this.playNote(f,0.4,'sine',0.12,i*0.15)); },
  sfxBomb(){
    this.resume();
    this.playNote(80,0.3,'sawtooth',0.12);
    this.playNote(120,0.2,'sine',0.1,0.05);
    if(this.ctx){
      const buf = this.ctx.createBuffer(1, this.ctx.sampleRate*0.3, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/d.length, 2);
      const src = this.ctx.createBufferSource(); src.buffer = buf;
      const g = this.ctx.createGain(); g.gain.value = 0.15;
      src.connect(g); g.connect(this.sfxGain); src.start();
    }
  },
  startMusic(type){
    this.resume();
    if(this.musicType === type) return;
    this.stopMusic();
    this.musicType = type;
    this.musicStep = 0;
    this.nextNoteTime = this.ctx.currentTime + 0.1;
    this.scheduler();
  },
  stopMusic(){
    if(this.musicTimer) clearTimeout(this.musicTimer);
    this.musicTimer = null; this.musicType = null;
  },
  scheduler(){
    if(!this.musicType) return;
    const bpm = this.musicType === 'menu' ? 60 : 88;
    const stepDur = 60 / bpm / 4;
    while(this.nextNoteTime < this.ctx.currentTime + 0.2){
      this.scheduleStep(this.musicType, this.musicStep, this.nextNoteTime);
      this.musicStep++;
      this.nextNoteTime += stepDur;
    }
    this.musicTimer = setTimeout(() => this.scheduler(), 50);
  },
  scheduleStep(type, idx, when){
    if(type === 'menu'){
      const mel = [0,-1,-1,2,-1,-1,4,-1,2,-1,0,-1,-1,3,-1,5,-1,2,-1,-1,4,-1,1,-1,0,-1,-1,2,-1,-1,3,-1];
      const notes = [261.63,329.63,392.00,440.00,523.25,659.25];
      const s = idx % mel.length; const m = mel[s];
      if(m >= 0) this.playMusic(notes[m], 1.2, 'sine', 0.06, when);
      if(s % 8 === 0) this.playMusic(s < 16 ? 130.81 : 174.61, 2.0, 'sine', 0.035, when);
    } else if(type === 'game'){
      const s = idx % 32;
      if(s % 8 === 0){
        const bass = [130.81,146.83,174.61,164.81];
        this.playMusic(bass[(s/8)|0], 0.8, 'triangle', 0.03, when);
      }
      const mel = [523.25,-1,587.33,-1,659.25,-1,587.33,-1,523.25,-1,440.00,-1,392.00,-1,440.00,-1,523.25,-1,587.33,-1,659.25,-1,783.99,-1,659.25,-1,587.33,-1,523.25,-1,-1,-1];
      const n = mel[s];
      if(n > 0) this.playMusic(n, 0.3, 'sine', 0.05, when);
    }
  },
  playMusic(freq, dur, type, vol, when){
    const osc = this.ctx.createOscillator(); const g = this.ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(vol, when + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, when + dur);
    osc.connect(g); g.connect(this.musicGain);
    osc.start(when); osc.stop(when + dur + 0.05);
  }
};

function makeDefaultLevels(){
  const out = [];
  for(let i = 0; i < 3; i++){
    const w = 6 + i, h = 6 + i;
    const room = {
      id: 'r_' + i, w, h,
      terrain: Array.from({length:h}, () => Array(w).fill(null)),
      objects: Array.from({length:h}, () => Array(w).fill(null))
    };
    const cols = ['red','blue','green'];
    for(let j = 0; j <= i; j++){
      room.terrain[2][2+j] = {t:'target', color: cols[j]};
      room.objects[4][3+j] = {o:'box', color: cols[j]};
    }
    out.push({
      id: 'lv_' + i, name: '关卡 ' + (i+1),
      rooms: [room], layout: [{roomId: room.id, x: 0, y: 0}],
      start: {roomId: room.id, x: 1, y: 1, facing: 'right', bodyColors: []}
    });
  }
  return out;
}
const LEVELS = (window.LEVELS && Array.isArray(window.LEVELS.levels)) ? window.LEVELS : {levels: []};

// 绘制工具
const _TX = {};
function hexToRgba(hex, a){
  if(!hex || hex[0] !== '#') return 'rgba(255,255,255,'+a+')';
  const h = hex.length===4 ? '#'+hex[1]+hex[1]+hex[2]+hex[2]+hex[3]+hex[3] : hex;
  const r = parseInt(h.slice(1,3),16), g = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function shade(hex, amt){
  if(!hex || hex[0] !== '#') return hex;
  const h = hex.length===4 ? '#'+hex[1]+hex[1]+hex[2]+hex[2]+hex[3]+hex[3] : hex;
  let r = parseInt(h.slice(1,3),16), g = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16);
  if(amt > 0){ r = Math.min(255,r+(255-r)*amt); g = Math.min(255,g+(255-g)*amt); b = Math.min(255,b+(255-b)*amt); }
  else { r = Math.max(0,r*(1+amt)); g = Math.max(0,g*(1+amt)); b = Math.max(0,b*(1+amt)); }
  const toH = v => { v = Math.floor(v); return v<16 ? '0'+v.toString(16) : v.toString(16); };
  return '#' + toH(r) + toH(g) + toH(b);
}
function rRect(c,x,y,w,h,r){
  if(r > w/2) r = w/2; if(r > h/2) r = h/2;
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.closePath();
}
function getTileTex(s){
  const k = 'tile_'+s; if(_TX[k]) return _TX[k];
  const cv = document.createElement('canvas'); cv.width = s; cv.height = s;
  const g = cv.getContext('2d');
  g.fillStyle = '#3a4150'; g.fillRect(0,0,s,s);
  const img = g.getImageData(0,0,s,s); const d = img.data;
  for(let i = 0; i < d.length; i += 4){
    const h = Math.sin(i*12.9898)*43758.5453;
    const n = (h - Math.floor(h) - 0.5) * 18;
    d[i] = Math.max(0,Math.min(255,d[i]+n));
    d[i+1] = Math.max(0,Math.min(255,d[i+1]+n));
    d[i+2] = Math.max(0,Math.min(255,d[i+2]+n));
  }
  g.putImageData(img,0,0);
  g.fillStyle = 'rgba(200,220,245,0.42)'; g.fillRect(0,0,s,1);
  g.fillStyle = 'rgba(200,220,245,0.32)'; g.fillRect(0,0,1,s);
  g.fillStyle = 'rgba(0,0,0,0.42)'; g.fillRect(0,s-1,s,1);
  g.fillStyle = 'rgba(0,0,0,0.32)'; g.fillRect(s-1,0,1,s);
  _TX[k] = cv; return cv;
}
function getReflTex(){
  const k = 'refl'; if(_TX[k]) return _TX[k];
  const N = 256; const cv = document.createElement('canvas'); cv.width = N; cv.height = N;
  const g = cv.getContext('2d');
  for(let i = 0; i < 24; i++){
    const px = ((Math.sin(i*12.9898)*43758.5453)%1+1)%1 * N;
    const py = ((Math.sin(i*78.233+1.7)*43758.5453)%1+1)%1 * N;
    const r = 10 + Math.abs(Math.sin(i*37.71))*20;
    const grad = g.createRadialGradient(px,py,0,px,py,r);
    grad.addColorStop(0,'rgba(210,230,255,0.18)');
    grad.addColorStop(1,'rgba(210,230,255,0)');
    g.fillStyle = grad; g.fillRect(0,0,N,N);
  }
  _TX[k] = cv; return cv;
}
function getWallTex(s, seed){
  const k = 'wall_'+s+'_'+seed; if(_TX[k]) return _TX[k];
  const cv = document.createElement('canvas'); cv.width = s; cv.height = s;
  const g = cv.getContext('2d');
  g.fillStyle = '#5a1e1a'; g.fillRect(0,0,s,s);
  g.fillStyle = '#4a1512'; g.fillRect(2,2,s-4,s-4);
  const bh = Math.floor(s/2);
  g.fillStyle = '#2a0806';
  g.fillRect(1,bh,s-2,2);
  g.fillRect(Math.floor(s/2),1,2,bh-1);
  g.fillRect(Math.floor(s/4),bh+2,2,s-bh-3);
  g.fillStyle = 'rgba(230,130,110,0.75)'; g.fillRect(0,0,s,2);
  g.fillStyle = 'rgba(220,120,100,0.55)'; g.fillRect(0,0,2,s);
  g.fillStyle = 'rgba(20,5,3,0.65)'; g.fillRect(s-3,0,3,s);
  g.fillStyle = 'rgba(8,2,1,0.80)'; g.fillRect(0,s-4,s,4);
  _TX[k] = cv; return cv;
}
function getAOTex(dir){
  const k = 'ao_'+dir; if(_TX[k]) return _TX[k];
  const N = 8; const cv = document.createElement('canvas'); cv.width = N; cv.height = N;
  const g = cv.getContext('2d');
  let grad;
  if(dir === 'L') grad = g.createLinearGradient(0,0,N,0);
  else if(dir === 'R') grad = g.createLinearGradient(N,0,0,0);
  else if(dir === 'T') grad = g.createLinearGradient(0,0,0,N);
  else grad = g.createLinearGradient(0,N,0,0);
  grad.addColorStop(0,'rgba(0,0,0,0.26)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = grad; g.fillRect(0,0,N,N);
  _TX[k] = cv; return cv;
}

function drawFloor(c,x,y,s,cx,cy,wallSet){
  c.drawImage(getTileTex(s),x,y);

      g2.addColorStop(0.6, 'rgba(40,30,30,'+(alpha*0.5)+')');
      g2.addColorStop(1, 'rgba(20,15,15,0)');
      c.fillStyle = g2;
      c.beginPath(); c.arc(px,py,sr,0,Math.PI*2); c.fill();
    }
  }
  c.restore();
}
function drawPortalFx(c,e,p){
  const x = e.x*CELL+CELL/2, y = e.y*CELL+CELL/2, s = CELL;
  const col = COLOR_HEX[e.color] || '#8a7cff';
  const r = s*0.3+p*s*0.6;
  c.strokeStyle = hexToRgba(col,1-p); c.lineWidth = 3*(1-p)+0.5;
  c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.stroke();
}
function drawEffects(c, roomId, now){
  for(const e of G.effects){
    if(e.roomId !== roomId) continue;
    const p = Math.min(1, e.t/e.dur);
    if(e.kind === 'crumble') drawCrumbleFx(c,e,p);
    else if(e.kind === 'fall') drawFallFx(c,e,p);
    else if(e.kind === 'explode') drawExplodeFx(c,e,p);
    else if(e.kind === 'portalFx') drawPortalFx(c,e,p);
  }
}

const Starfield = {
  stars: [], meteors: [], lastW: 0, lastH: 0, nextMeteor: 0,
  init(w,h){
    this.stars = [];
    const cnt = Math.max(80, Math.floor(w*h/2600));
    for(let i = 0; i < cnt; i++){
      this.stars.push({
        x: Math.random()*w, y: Math.random()*h,
        r: 0.4+Math.random()*1.3,
        base: 0.3+Math.random()*0.55,
        speed: 0.6+Math.random()*2.4,
        phase: Math.random()*Math.PI*2,
        hue: Math.random()<0.6?250:(Math.random()<0.5?280:300)
      });
    }
    this.lastW = w; this.lastH = h;
    this.meteors = [];
    this.nextMeteor = performance.now()+1000+Math.random()*2000;
  },
  update(w,h,dt){
    if(Math.abs(w-this.lastW) > 2 || Math.abs(h-this.lastH) > 2) this.init(w,h);
    const now = performance.now();
    if(now > this.nextMeteor){
      this.spawnMeteor(w,h);
      this.nextMeteor = now+3000+Math.random()*5000;
    }
    for(let i = this.meteors.length-1; i >= 0; i--){
      const m = this.meteors[i];
      m.x += m.vx*dt; m.y += m.vy*dt; m.life -= dt;
      if(m.life <= 0) this.meteors.splice(i,1);
    }
  },
  spawnMeteor(w,h){
    const fl = Math.random()<0.5;
    const x = fl ? -80 : w+80;
    const y = Math.random()*h*0.7-h*0.1;
    const ang = fl ? (Math.PI*0.12+Math.random()*0.3) : (Math.PI-Math.PI*0.12-Math.random()*0.3);
    const sp = 500+Math.random()*500;
    const life = 1.4+Math.random()*0.8;
    this.meteors.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life,maxLife:life,angle:ang});
  },
  draw(c,w,h,t,offX,offY){
    offX = offX||0; offY = offY||0;
    const grad = c.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h)*0.75);
    grad.addColorStop(0,'#1a0a2e'); grad.addColorStop(0.5,'#0f0520'); grad.addColorStop(1,'#050212');
    c.fillStyle = grad; c.fillRect(0,0,w,h);
    for(let i = 0; i < this.stars.length; i++){
      const s = this.stars[i];
      const sx = ((s.x+offX)%w+w)%w;
      const sy = ((s.y+offY)%h+h)%h;
      const tw = s.base + Math.sin(t*s.speed+s.phase)*0.4;
      const a = tw<0?0:(tw>1?1:tw);
      c.fillStyle = `hsla(${s.hue},55%,95%,${a})`;
      c.beginPath(); c.arc(sx,sy,s.r,0,Math.PI*2); c.fill();
    }
    for(let i = 0; i < this.meteors.length; i++){
      const m = this.meteors[i];
      const lr = m.life>0?m.life/m.maxLife:0;
      const tl = 100+130*(1-lr);
      const tx = m.x-Math.cos(m.angle)*tl;
      const ty = m.y-Math.sin(m.angle)*tl;
      const mg = c.createLinearGradient(m.x,m.y,tx,ty);
      mg.addColorStop(0,`rgba(255,255,255,${lr})`);
      mg.addColorStop(1,'rgba(120,180,255,0)');
      c.strokeStyle = mg; c.lineWidth = 2.2; c.lineCap = 'round';
      c.beginPath(); c.moveTo(m.x,m.y); c.lineTo(tx,ty); c.stroke();
      c.fillStyle = `rgba(255,255,255,${lr})`;
      c.beginPath(); c.arc(m.x,m.y,2.2,0,Math.PI*2); c.fill();
    }
  }
};

function getRoom(lv,id){ return lv.rooms.find(r => r.id === id); }
function getLayout(lv, id){ return lv.layout.find(l => l.roomId === id); }
function isBorder(r,x,y){ return x === 0 || y === 0 || x === r.w-1 || y === r.h-1; }
function getBorderSide(r,x,y){
  if(x === 0) return 'left';
  if(x === r.w-1) return 'right';
  if(y === 0) return 'up';
  if(y === r.h-1) return 'down';
  return null;
}
function findAdjacent(lv, id, side){
  const lay = getLayout(lv,id); const room = getRoom(lv,id);
  if(!lay || !room) return null;
  const W = room.w*CELL, H = room.h*CELL;
  for(const l of lv.layout){
    if(l.roomId === id) continue;
    const o = getRoom(lv, l.roomId); if(!o) continue;
    const oW = o.w*CELL, oH = o.h*CELL;
    if(side === 'left' && Math.abs(lay.x-(l.x+oW))<2 && !(lay.y+H<=l.y || l.y+oH<=lay.y)) return {roomId:l.roomId, room:o, lay:l};
    if(side === 'right' && Math.abs((lay.x+W)-l.x)<2 && !(lay.y+H<=l.y || l.y+oH<=lay.y)) return {roomId:l.roomId, room:o, lay:l};
    if(side === 'up' && Math.abs(lay.y-(l.y+oH))<2 && !(lay.x+W<=l.x || l.x+oW<=lay.x)) return {roomId:l.roomId, room:o, lay:l};
    if(side === 'down' && Math.abs((lay.y+H)-l.y)<2 && !(lay.x+W<=l.x || l.x+oW<=lay.x)) return {roomId:l.roomId, room:o, lay:l};
  }
  return null;
}
function getPassageRange(size){
  if(size < 5) return {min:Math.floor(size/2), max:Math.floor(size/2)};
  const mid = Math.floor(size/2);
  return {min:mid-1, max:mid+1};
}
function isPassage(lv, room, x, y){
  if(!isBorder(room,x,y)) return false;
  const side = getBorderSide(room,x,y); if(!side) return false;
  const adj = findAdjacent(lv, room.id, side); if(!adj) return false;
  const t = room.terrain[y][x];
  if(t && t.t === 'wall') return false;
  if(t && t.t === 'passage') return true;
  const r = getPassageRange(side === 'left' || side === 'right' ? room.h : room.w);
  if(side === 'left' || side === 'right') return y >= r.min && y <= r.max;
  return x >= r.min && x <= r.max;
}

function resizeCanvas(){
  const W = window.innerWidth, H = window.innerHeight;
  const TARGET = 16 / 9;
  let cw, ch;
  if(W / H > TARGET){ ch = H; cw = Math.floor(H * TARGET); }
  else { cw = W; ch = Math.floor(W / TARGET); }
  const left = Math.floor((W - cw) / 2);
  const top  = Math.floor((H - ch) / 2);
  canvas.width  = Math.floor(cw * dpr);
  canvas.height = Math.floor(ch * dpr);
  // 用 inline !important 压住 CSS 里 position:fixed;inset:0 / transform scale / clip-path
  function setCanvasBox(el){
    if(!el) return;
    el.style.setProperty('width',         cw + 'px',  'important');
    el.style.setProperty('height',        ch + 'px',  'important');
    el.style.setProperty('left',          left + 'px','important');
    el.style.setProperty('top',           top + 'px', 'important');
    el.style.setProperty('right',         'auto',     'important');
    el.style.setProperty('bottom',        'auto',     'important');
    el.style.setProperty('transform',     'none',     'important');
    el.style.setProperty('clip-path',     'none',     'important');
    el.style.setProperty('border-radius', '0',        'important');
  }
  setCanvasBox(canvas);
  if(crtCanvasRef){
    crtCanvasRef.width  = Math.floor(cw * dpr);
    crtCanvasRef.height = Math.floor(ch * dpr);
    setCanvasBox(crtCanvasRef);
  }
  const hudEl = document.getElementById('hud');
  if(hudEl){
    hudEl.style.setProperty('width',     cw + 'px',  'important');
    hudEl.style.setProperty('height',    ch + 'px',  'important');
    hudEl.style.setProperty('left',      left + 'px','important');
    hudEl.style.setProperty('top',       top + 'px', 'important');
    hudEl.style.setProperty('right',     'auto',     'important');
    hudEl.style.setProperty('bottom',    'auto',     'important');
    hudEl.style.setProperty('clip-path', 'none',     'important');
  }
  // ★ 同步 WebGL viewport（若 gl 已初始化）
  try {
    if (typeof gl !== 'undefined' && gl && typeof crtProgram !== 'undefined' && crtProgram) {
      gl.viewport(0, 0, crtCanvasRef.width, crtCanvasRef.height);
    }
  } catch(e){}
}

function initPlay(data){
  G.level = clone(data);
  G.bodyColors = (G.level.start.bodyColors||[]).slice();
  G.facing = G.level.start.facing || 'right';
  G.dead = false; G.win = false; G.paused = false;

  G.showBigMap = false; G.transition = null;
  const dir = DIRS[G.facing];
  const n = G.bodyColors.length;
  const path = [];
  for(let i = n; i >= 1; i--){
    path.push({roomId: G.level.start.roomId, x: G.level.start.x - dir.x*i, y: G.level.start.y - dir.y*i});
  }
  path.push({roomId: G.level.start.roomId, x: G.level.start.x, y: G.level.start.y});

  G.head = {roomId: G.level.start.roomId, x: G.level.start.x, y: G.level.start.y};
  G.roomId = G.level.start.roomId;
  G.level.rooms.forEach(r => {
    for(let y = 0; y < r.h; y++){
      for(let x = 0; x < r.w; x++){
        if(r.objects[y][x] && r.objects[y][x].o === 'spawn') r.objects[y][x] = null;
        const o = r.objects[y][x];
        if(o && o.o === 'box') o._originKey = r.id+','+x+','+y;
      }
    }
  });
  let total = 0;
  G.level.rooms.forEach(r => {
    for(let y = 0; y < r.h; y++){
      for(let x = 0; x < r.w; x++){
        if(r.terrain[y][x] && r.terrain[y][x].t === 'target') total++;
      }
    }
  });

function getRoomP(id){ return G.level.rooms.find(r => r.id === id); }
function getLayoutP(id){ return G.level.layout.find(l => l.roomId === id); }
function playerLen(){ return 1 + G.bodyColors.length; }
function getBodyPos(k){
  const idx = G.path.length-1-k;
  return idx >= 0 ? G.path[idx] : null;
}
function entityAt(roomId, x, y){
  if(G.head.roomId === roomId && G.head.x === x && G.head.y === y) return {type:'head'};
  for(let k = 1; k <= G.bodyColors.length; k++){
    const p = getBodyPos(k);
    if(p && p.roomId === roomId && p.x === x && p.y === y) return {type:'body', color:G.bodyColors[k-1], k};
  }
  const room = getRoomP(roomId);
  if(room){
    const o = room.objects[y] && room.objects[y][x];
    if(o && o.o === 'box') return {type:'box', color:o.color};
    if(o && o.o === 'portal' && o.coveredBox) return {type:'box', color:o.coveredBox.color, onPortal:true};
  }
  return null;
}
function getDoorOpen(room, x, y){
  const t = room.terrain[y] && room.terrain[y][x];
  if(!t || t.t !== 'door') return false;
  return playerLen() === t.n;
}
function canEnter(lv, room, x, y){
  if(isBorder(room,x,y) && !isPassage(lv,room,x,y)) return false;
  const t = room.terrain[y] && room.terrain[y][x];
  if(!t) return true;
  if(t.t === 'wall') return false;
  if(t.t === 'door') return getDoorOpen(room,x,y);
  if(t.t === 'crumble') return t.n > 0;
  return true;
}
function findAdjacentP(lv, roomId, side){
  const lay = getLayoutP(roomId); const room = getRoomP(roomId);
  if(!lay || !room) return null;
  const W = room.w*CELL, H = room.h*CELL;
  for(const l of lv.layout){
    if(l.roomId === roomId) continue;
    const o = getRoomP(l.roomId); if(!o) continue;
    const oW = o.w*CELL, oH = o.h*CELL;
    if(side === 'left' && Math.abs(lay.x-(l.x+oW))<2 && !(lay.y+H<=l.y || l.y+oH<=lay.y)) return {roomId:l.roomId, room:o};
    if(side === 'right' && Math.abs((lay.x+W)-l.x)<2 && !(lay.y+H<=l.y || l.y+oH<=lay.y)) return {roomId:l.roomId, room:o};
    if(side === 'up' && Math.abs(lay.y-(l.y+oH))<2 && !(lay.x+W<=l.x || l.x+oW<=lay.x)) return {roomId:l.roomId, room:o};
    if(side === 'down' && Math.abs((lay.y+H)-l.y)<2 && !(lay.x+W<=l.x || l.x+oW<=lay.x)) return {roomId:l.roomId, room:o};
  }
  return null;
}
function findPortalPair(code, roomId, x, y){
  const all = [];
  G.level.rooms.forEach(r => {
    for(let yy = 0; yy < r.h; yy++){
      for(let xx = 0; xx < r.w; xx++){
        const o = r.objects[yy][xx];
        if(o && o.o === 'portal' && o.code === code) all.push({roomId:r.id, x:xx, y:yy});
      }
    }
  });
  return all.find(e => !(e.roomId === roomId && e.x === x && e.y === y)) || null;
}

function canMoveInDirG(dirName){
  if(G.dead || G.win || G.pendingDeath) return false;
  const dv = DIRS[dirName];
  const head = G.head;
  const room = getRoomP(head.roomId);
  if(!room) return false;
  let nx = head.x + dv.x, ny = head.y + dv.y;
  let nroomId = head.roomId, nroom = room;
  if(nx < 0 || nx >= room.w || ny < 0 || ny >= room.h){
    const side = nx < 0 ? 'left' : nx >= room.w ? 'right' : ny < 0 ? 'up' : 'down';
    const adj = findAdjacentP(G.level, head.roomId, side);
    if(!adj) return false;
    if(side === 'left' || side === 'right'){ if(room.h !== adj.room.h) return false; }
    else { if(room.w !== adj.room.w) return false; }
    nroomId = adj.roomId; nroom = adj.room;
    if(side === 'left'){ nx = nroom.w-1; ny = head.y; }
    else if(side === 'right'){ nx = 0; ny = head.y; }
    else if(side === 'up'){ ny = nroom.h-1; nx = head.x; }
    else { ny = 0; nx = head.x; }
    if(nx < 0 || nx >= nroom.w || ny < 0 || ny >= nroom.h) return false;
  }
  if(!canEnter(G.level, nroom, nx, ny)) return false;
  const ent = entityAt(nroomId, nx, ny);
  if(ent && ent.type === 'body' && ent.k === 1) return false;
  if(ent && (ent.type === 'box' || (ent.type === 'body' && ent.k >= 2))){
    const bnx = nx + dv.x, bny = ny + dv.y;
    let bnroomId = nroomId, bnroom = nroom, bbx = bnx, bby = bny;
    if(bnx < 0 || bnx >= nroom.w || bny < 0 || bny >= nroom.h){
      const side = bnx < 0 ? 'left' : bnx >= nroom.w ? 'right' : bny < 0 ? 'up' : 'down';
      const adj2 = findAdjacentP(G.level, nroomId, side);
      if(!adj2) return false;
      if(side === 'left' || side === 'right'){ if(nroom.h !== adj2.room.h) return false; }
      else { if(nroom.w !== adj2.room.w) return false; }
      bnroomId = adj2.roomId; bnroom = adj2.room;
      if(side === 'left'){ bbx = bnroom.w-1; bby = ny; }
      else if(side === 'right'){ bbx = 0; bby = ny; }
      else if(side === 'up'){ bby = bnroom.h-1; bbx = nx; }
      else { bby = 0; bbx = nx; }
      if(bbx < 0 || bbx >= bnroom.w || bby < 0 || bby >= bnroom.h) return false;
    }
    if(!canEnter(G.level, bnroom, bbx, bby)) return false;
    if(entityAt(bnroomId, bbx, bby)) return false;
    const fObj = bnroom.objects[bby] && bnroom.objects[bby][bbx];
    if(fObj && fObj.o === 'bean') return false;
  }
  return true;
}

function checkStuckG(){
  if(G.dead || G.win || G.pendingDeath) return;
  for(const d of ['up','down','left','right']){
    if(canMoveInDirG(d)) return;
  }
  G.pendingDeath = true;
  G.deathReason = 'stuck';
  G.deathDelay = 0.6;
}

function makeUndoSnapshot(){
  return {
    head:{roomId:G.head.roomId, x:G.head.x, y:G.head.y},
    facing: G.facing, roomId: G.roomId,
    path: G.path.map(p => ({roomId:p.roomId, x:p.x, y:p.y})),

    rooms: G.level.rooms.map(r => ({
      id: r.id,
      terrain: r.terrain.map(row => row.map(t => t?{...t}:null)),
      objects: r.objects.map(row => row.map(o => o?{...o}:null))
    }))
  };
}
function restoreUndo(s){
  G.head = {roomId:s.head.roomId, x:s.head.x, y:s.head.y};
  G.facing = s.facing;
  G.roomId = s.roomId;
  G.path = s.path.map(p => ({...p}));
  G.bodyColors = [...s.bodyColors];
  for(const rs of s.rooms){
    const r = G.level.rooms.find(x => x.id === rs.id);
    if(r){
      r.terrain = rs.terrain.map(row => row.map(t => t?{...t}:null));
      r.objects = rs.objects.map(row => row.map(o => o?{...o}:null));
    }
  }
  G.pendingDeath = false; G.dead = false;
  G.effects = []; G.doorAnim = {};
  updateTargetCount();
  updateHud();
}
function doUndo(){
  if(G.dead || G.win || G.paused || G.pendingDeath) return;
  if(!G.undoStack.length) return;
  const snap = G.undoStack.pop();
  restoreUndo(snap);
  AUDIO.sfxUndo();
}

function tryMove(dirName){
  if(G.dead || G.win || G.paused || G.pendingDeath) return;
  if(G.transition && G.transition.active) return;
  checkStuckG();
  if(G.pendingDeath) return;
  const before = makeUndoSnapshot();
  const moved = doMove(dirName);
  if(moved){
    G.undoStack.push(before);
    if(G.undoStack.length > 200) G.undoStack.shift();
    G.steps++;
    updateHud();
  }
}

function doMove(dirName){
  const dv = DIRS[dirName];
  G.facing = dirName;
  const head = G.head;
  const room = getRoomP(head.roomId);
  let nx = head.x+dv.x, ny = head.y+dv.y;
  let nroomId = head.roomId, nroom = room;
  if(nx < 0 || nx >= room.w || ny < 0 || ny >= room.h){
    const side = nx<0?'left':nx>=room.w?'right':ny<0?'up':'down';
    const adj = findAdjacentP(G.level, head.roomId, side);
    if(!adj) return false;
    if(side === 'left' || side === 'right'){ if(room.h !== adj.room.h) return false; }
    else { if(room.w !== adj.room.w) return false; }
    nroomId = adj.roomId; nroom = adj.room;
    if(side === 'left'){ nx = nroom.w-1; ny = head.y; }
    else if(side === 'right'){ nx = 0; ny = head.y; }
    else if(side === 'up'){ ny = nroom.h-1; nx = head.x; }
    else { ny = 0; nx = head.x; }
    if(nx < 0 || nx >= nroom.w || ny < 0 || ny >= nroom.h) return false;
  }
  if(!canEnter(G.level, nroom, nx, ny)) return false;
  const targetEnt = entityAt(nroomId, nx, ny);
  const targetObj = nroom.objects[ny][nx];
  const isBomb = targetObj && targetObj.o === 'bomb';
  const isPortal = targetObj && targetObj.o === 'portal';
  const isBean = targetObj && targetObj.o === 'bean';
  let pushBox = null;
  if(targetEnt && targetEnt.type === 'body'){ if(targetEnt.k === 1) return false; pushBox = targetEnt; }
  else if(targetEnt && targetEnt.type === 'box') pushBox = targetEnt;
  if(pushBox){
    const bnx = nx+dv.x, bny = ny+dv.y;
    let bnroomId = nroomId, bnroom = nroom, bbx = bnx, bby = bny;
    if(bnx < 0 || bnx >= nroom.w || bny < 0 || bny >= nroom.h){
      const side = bnx<0?'left':bnx>=nroom.w?'right':bny<0?'up':'down';
      const adj2 = findAdjacentP(G.level, nroomId, side);
      if(!adj2) return false;
      if(side === 'left' || side === 'right'){ if(nroom.h !== adj2.room.h) return false; }
      else { if(nroom.w !== adj2.room.w) return false; }
      bnroomId = adj2.roomId; bnroom = adj2.room;
      if(side === 'left'){ bbx = bnroom.w-1; bby = ny; }
      else if(side === 'right'){ bbx = 0; bby = ny; }
      else if(side === 'up'){ bby = bnroom.h-1; bbx = nx; }
      else { bby = 0; bbx = nx; }
      if(bbx < 0 || bbx >= bnroom.w || bby < 0 || bby >= bnroom.h) return false;
    }
    if(!canEnter(G.level, bnroom, bbx, bby)) return false;
    if(entityAt(bnroomId, bbx, bby)) return false;
    const fObj = bnroom.objects[bby] && bnroom.objects[bby][bbx];
    if(fObj && fObj.o === 'bean') return false;
    const fBomb = fObj && fObj.o === 'bomb';
    const fPortal = fObj && fObj.o === 'portal';
    if(pushBox.type === 'box'){
      const fromCovered = !!pushBox.onPortal;
      const pushColor = pushBox.color;
      if(fromCovered){ delete nroom.objects[ny][nx].coveredBox; }
      else { nroom.objects[ny][nx] = null; }
      if(fBomb){ bnroom.objects[bby][bbx] = null; AUDIO.sfxBomb(); }
      else if(fPortal){
        const pair = findPortalPair(fObj.code, bnroomId, bbx, bby);
        /* FIX: 若出口被玩家头/身体占用，则箱子留在入口传送门上，不传送 */
        const pairOccupied = pair ? !!entityAt(pair.roomId, pair.x, pair.y) : true;
        if(pair && !pairOccupied){
          const pr = getRoomP(pair.roomId);
          const outObj = pr && pr.objects[pair.y] && pr.objects[pair.y][pair.x];
          if(outObj && outObj.o === 'portal' && !outObj.coveredBox){
            outObj.coveredBox = {color: pushColor};
            addEffect({kind:'portalFx', roomId:pair.roomId, x:pair.x, y:pair.y, color:fObj.color, t:0, dur:0.6});
          } else {
            fObj.coveredBox = {color: pushColor};
          }
        } else {
          fObj.coveredBox = {color: pushColor};
        }
        AUDIO.sfxPortal();
      } else bnroom.objects[bby][bbx] = {o:'box', color:pushColor};
    } else {
      const k = pushBox.k;
      const col = G.bodyColors[k-1];
      for(let j = k+1; j <= G.bodyColors.length; j++){
        const p = getBodyPos(j);
        if(p){ const rr = getRoomP(p.roomId); if(rr && !rr.objects[p.y][p.x]) rr.objects[p.y][p.x] = {o:'box', color:G.bodyColors[j-1]}; }
      }
      if(fBomb){ bnroom.objects[bby][bbx] = null; AUDIO.sfxBomb(); }
      else if(fPortal){
        const pair = findPortalPair(fObj.code, bnroomId, bbx, bby);
        /* FIX: 若出口被玩家头/身体占用，则箱子留在入口传送门上，不传送 */
        const pairOccupied = pair ? !!entityAt(pair.roomId, pair.x, pair.y) : true;
        if(pair && !pairOccupied){
          const pr = getRoomP(pair.roomId);
          const outObj = pr && pr.objects[pair.y] && pr.objects[pair.y][pair.x];
          if(outObj && outObj.o === 'portal' && !outObj.coveredBox){
            outObj.coveredBox = {color: col};
            addEffect({kind:'portalFx', roomId:pair.roomId, x:pair.x, y:pair.y, color:fObj.color, t:0, dur:0.6});
          } else {
            fObj.coveredBox = {color: col};
          }
        } else {
          fObj.coveredBox = {color: col};
        }
        AUDIO.sfxPortal();
      } else bnroom.objects[bby][bbx] = {o:'box', color:col};
      G.bodyColors = G.bodyColors.slice(0, k-1);
      G.path = G.path.slice(-k);
    }
    G.head = {roomId:nroomId, x:nx, y:ny};
    G.path.push({roomId:nroomId, x:nx, y:ny});
    const maxP = G.bodyColors.length+16;
    if(G.path.length > maxP) G.path = G.path.slice(-maxP);
    if(nroomId !== G.roomId) startTransition(nroomId);
    AUDIO.sfxPush();
    checkCrumbleAtBox(bnroomId, bbx, bby);
    checkCrumbleAtHead();
    checkCrumbleAtBody();
    checkWin();
    checkStuckG();
    return true;
  }
  if(isBomb){
    nroom.objects[ny][nx] = null;
    G.head = {roomId:nroomId, x:nx, y:ny};
    G.path.push({roomId:nroomId, x:nx, y:ny});
    addEffect({kind:'explode', roomId:nroomId, x:nx, y:ny, t:0, dur:0.35});
    AUDIO.sfxBomb();
    G.pendingDeath = true; G.deathReason = 'bomb'; G.deathDelay = 0.35;
    if(nroomId !== G.roomId) startTransition(nroomId);
    return true;
  }
  if(isPortal){
    const pair = findPortalPair(targetObj.code, nroomId, nx, ny);
    if(pair && !entityAt(pair.roomId, pair.x, pair.y)){
      G.head = {roomId:pair.roomId, x:pair.x, y:pair.y};
      G.path.push({roomId:pair.roomId, x:pair.x, y:pair.y});
      addEffect({kind:'portalFx', roomId:nroomId, x:nx, y:ny, color:targetObj.color, t:0, dur:0.6});
      addEffect({kind:'portalFx', roomId:pair.roomId, x:pair.x, y:pair.y, color:targetObj.color, t:0, dur:0.6});
      if(pair.roomId !== G.roomId) startTransition(pair.roomId);
    } else {
      G.head = {roomId:nroomId, x:nx, y:ny};
      G.path.push({roomId:nroomId, x:nx, y:ny});
      addEffect({kind:'portalFx', roomId:nroomId, x:nx, y:ny, color:targetObj.color, t:0, dur:0.6});
      if(nroomId !== G.roomId) startTransition(nroomId);
    }
    AUDIO.sfxPortal();
    checkCrumbleAtHead(); checkCrumbleAtBody(); checkWin(); checkStuckG();
    return true;
  }
  if(isBean){
    nroom.objects[ny][nx] = null;
    G.bodyColors.push(targetObj.color);
    G.head = {roomId:nroomId, x:nx, y:ny};
    G.path.push({roomId:nroomId, x:nx, y:ny});
    if(nroomId !== G.roomId) startTransition(nroomId);
    AUDIO.sfxBean();
    checkCrumbleAtHead(); checkCrumbleAtBody(); checkWin(); checkStuckG();
    return true;
  }
  G.head = {roomId:nroomId, x:nx, y:ny};
  G.path.push({roomId:nroomId, x:nx, y:ny});
  const maxP = G.bodyColors.length+16;
  if(G.path.length > maxP) G.path = G.path.slice(-maxP);
  if(nroomId !== G.roomId) startTransition(nroomId);
  checkCrumbleAtHead(); checkCrumbleAtBody(); checkWin(); checkStuckG();
  return true;
}

function checkCrumbleAtHead(){
  if(G.dead || G.win || G.pendingDeath) return;
  const hr = getRoomP(G.head.roomId);
  if(!hr) return;
  const t = hr.terrain[G.head.y] && hr.terrain[G.head.y][G.head.x];
  if(!t || t.t !== 'crumble' || t.n <= 0) return;
  t.n -= 1;
  if(t.n <= 0){
    addEffect({kind:'crumble', roomId:hr.id, x:G.head.x, y:G.head.y, t:0, dur:0.6});
    G.pendingDeath = true; G.deathReason = 'fall'; G.deathDelay = 0.9;
  }
}
function checkCrumbleAtBox(roomId, x, y){
  const room = getRoomP(roomId); if(!room) return;
  const t = room.terrain[y] && room.terrain[y][x];
  if(!t || t.t !== 'crumble' || t.n <= 0) return;
  t.n -= 1;
  if(t.n <= 0){
    const obj = room.objects[y] && room.objects[y][x];
    addEffect({kind:'crumble', roomId:room.id, x, y, t:0, dur:0.6});
    if(obj && obj.o === 'box'){
      room.objects[y][x] = null;
      addEffect({kind:'fall', roomId:room.id, x, y, color:obj.color, t:0, dur:0.75});
    }
  }
}
function checkCrumbleAtBody(){
  // 找出所有脚下碎砖坍塌的身体节
  const crumbledK = [];
  for(let k = G.bodyColors.length; k >= 1; k--){
    const idx = G.path.length-1-k;
    if(idx < 0) continue;
    const p = G.path[idx]; if(!p) continue;
    const room = getRoomP(p.roomId); if(!room) continue;
    const t = room.terrain[p.y] && room.terrain[p.y][p.x];
    if(!t || t.t !== 'crumble' || t.n <= 0) continue;
    t.n -= 1;
    if(t.n <= 0){
      crumbledK.push(k);
    }
  }
  if(crumbledK.length === 0) return;

  // 断裂点 = 最小的 k
  let minK = crumbledK[0];
  for(const k of crumbledK){ if(k < minK) minK = k; }

  // 所有坍塌点：碎砖特效
  for(const k of crumbledK){
    const idx = G.path.length-1-k;
    if(idx < 0) continue;
    const p = G.path[idx]; if(!p) continue;
    addEffect({kind:'crumble', roomId:p.roomId, x:p.x, y:p.y, t:0, dur:0.6});
  }
  // 掉落特效：只有 minK 这一节真的掉落了
  {
    const idx = G.path.length-1-minK;
    if(idx >= 0){
      const p = G.path[idx];
      if(p) addEffect({kind:'fall', roomId:p.roomId, x:p.x, y:p.y, color:G.bodyColors[minK-1], t:0, dur:0.75});
    }
  }

  // ★ 数据变更 1：minK+1 到末尾 → 变箱子留在原地
  for(let k = minK + 1; k <= G.bodyColors.length; k++){
    const idx = G.path.length-1-k;
    if(idx < 0) continue;
    const p = G.path[idx]; if(!p) continue;
    const room = getRoomP(p.roomId);
    if(room && !room.objects[p.y][p.x]){
      room.objects[p.y][p.x] = { o: 'box', color: G.bodyColors[k-1] };
    }
  }
  // ★ 数据变更 2：截断到前 minK-1 节
  G.bodyColors = G.bodyColors.slice(0, minK - 1);
  G.path = G.path.slice(-minK);
}

function checkWin(){
  if(G.win || G.dead) return;
  for(const room of G.level.rooms){
    for(let y = 0; y < room.h; y++){
      for(let x = 0; x < room.w; x++){
        const t = room.terrain[y][x];
        if(t && t.t === 'target'){
          let ok = false;
          const ent = entityAt(room.id, x, y);
          if(ent){
            const col = ent.type === 'head' ? 'white' : ent.color;
            if(col === t.color) ok = true;
          }
          // 传送门双面桥接：入口和出口是"同一个逻辑格子的两面"
          // 若本侧目标没被占据，但另一侧同一传送门被占据且颜色匹配，也算占据
          if(!ok){
            const roomObj = getRoomP(room.id);
            if(roomObj){
              const obj = roomObj.objects[y] && roomObj.objects[y][x];
              if(obj && obj.o === 'portal'){
                const pair = findPortalPair(obj.code, room.id, x, y);
                if(pair){
                  const ent2 = entityAt(pair.roomId, pair.x, pair.y);
                  if(ent2){
                    const col2 = ent2.type === 'head' ? 'white' : ent2.color;
                    if(col2 === t.color) ok = true;
                  }
                }
              }
            }
          }
          if(!ok) return;
        }
      }
    }
  }
  G.win = true;
  AUDIO.sfxWin();
  const isNew = Save.setBest(G.currentLevelIdx, G.steps);
  Save.unlockAfter(G.currentLevelIdx);
  setTimeout(() => showWin(isNew), 800);
}
function showWin(isNew){
  $('#winSteps').textContent = G.steps;
  $('#winBest').textContent = isNew ? window.t('win.newRecord') : '';
  const nextIdx = G.currentLevelIdx+1;
  const hasNext = nextIdx < LEVELS.levels.length && nextIdx < (Save.data.unlocked||1);
  $('#winNext').style.display = hasNext ? '' : 'none';
  $('#winModal').classList.add('active');
}

function startTransition(newId){
  const fromId = G.roomId;
  G.roomId = newId;
  const fL = G.level.layout.find(l => l.roomId === fromId);
  const tL = G.level.layout.find(l => l.roomId === newId);
  let dir = 'right';
  if(fL && tL){
    if(tL.x > fL.x) dir = 'right';
    else if(tL.x < fL.x) dir = 'left';
    else if(tL.y > fL.y) dir = 'down';
    else if(tL.y < fL.y) dir = 'up';
  }
  G.transition = {active:true, t:0, duration:0.42, fromRoom:fromId, toRoom:newId, dir};
}
function addEffect(e){ if(e.t === undefined) e.t = 0; G.effects.push(e); }
function updateEffects(dt){
  for(let i = G.effects.length-1; i >= 0; i--){
    G.effects[i].t += dt;
    if(G.effects[i].t >= G.effects[i].dur) G.effects.splice(i,1);
  }
}

function updateHud(){
  updateTargetCount();
  $('#hudStepsVal').textContent = G.steps;
  $('#hudTargetsVal').textContent = G.targetDone+'/'+G.targetTotal;
  drawHudMinimap();
}
function updateTargetCount(){
  if(!G.level) return;
  let done = 0;
  for(const room of G.level.rooms){
    for(let y = 0; y < room.h; y++){
      for(let x = 0; x < room.w; x++){
        const t = room.terrain[y][x];
        if(t && t.t === 'target'){
          const ent = entityAt(room.id, x, y);
          if(ent){
            const col = ent.type === 'head' ? 'white' : ent.color;
            if(col === t.color) done++;
          }
        }
      }
    }
  }
  G.targetDone = done;
}
function drawHudMinimap(){
  const mm = $('#hudMinimapCanvas'); if(!mm || !G.level) return;
  const W = 170, H = 120;
  mm.width = Math.floor(W*dpr); mm.height = Math.floor(H*dpr);
  mm.style.width = W+'px'; mm.style.height = H+'px';
  const c = mm.getContext('2d');
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,W,H);
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  G.level.rooms.forEach(room => {
    const lay = getLayout(G.level, room.id); if(!lay) return;
    minX = Math.min(minX, lay.x); minY = Math.min(minY, lay.y);
    maxX = Math.max(maxX, lay.x+room.w*CELL); maxY = Math.max(maxY, lay.y+room.h*CELL);
  });
  if(!isFinite(minX)) return;
  const w = maxX-minX, h = maxY-minY;
  const sc = Math.min((W-8)/w, (H-8)/h);
  const ox = (W-w*sc)/2-minX*sc, oy = (H-h*sc)/2-minY*sc;
  G.level.rooms.forEach(room => {
    const lay = getLayout(G.level, room.id); if(!lay) return;
    const isCur = room.id === G.roomId;
    c.fillStyle = isCur ? 'rgba(0,255,170,.35)' : 'rgba(60,80,110,.35)';
    c.fillRect(ox+lay.x*sc, oy+lay.y*sc, room.w*CELL*sc, room.h*CELL*sc);
    c.strokeStyle = isCur ? '#00ffaa' : '#3a4a5a'; c.lineWidth = 1;
    c.strokeRect(ox+lay.x*sc+0.5, oy+lay.y*sc+0.5, room.w*CELL*sc-1, room.h*CELL*sc-1);
  });
  const hr = getRoomP(G.head.roomId);
  if(hr){
    const lay = getLayout(G.level, hr.id);
    if(lay){
      const px = ox+(lay.x+(G.head.x+0.5)*CELL)*sc;
      const py = oy+(lay.y+(G.head.y+0.5)*CELL)*sc;
      c.fillStyle = '#fff';
      c.beginPath(); c.arc(px,py,2.5,0,Math.PI*2); c.fill();
      c.strokeStyle = '#00ffaa'; c.lineWidth = 1.5; c.stroke();
    }
  }
}

function renderTitle(t){
  const W = canvas.width / dpr, H = canvas.height / dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  Starfield.update(W,H,1/60);
  Starfield.draw(ctx, W, H, t, 0, 0);
  const demo = {
    w: 9, h: 6,
    terrain: [
      [null,null,null,null,null,null,null,null,null],
      [null,null,null,null,null,null,null,null,null],
      [null,null,{t:'target',color:'red'},null,null,{t:'target',color:'blue'},null,null,null],
      [null,null,null,null,null,null,null,null,null],
      [null,null,null,null,null,null,null,null,null],
      [null,null,null,null,null,null,null,null,null]
    ],
    objects: [
      [null,null,null,null,null,null,null,null,null],
      [null,null,null,null,null,null,null,null,null],
      [null,null,null,null,null,null,null,null,null],
      [null,null,null,null,null,null,null,null,null],
      [null,null,{o:'box',color:'red'},null,null,{o:'box',color:'blue'},null,null,null],
      [null,null,null,null,null,null,null,null,null]
    ]
  };
  const rw = demo.w*CELL, rh = demo.h*CELL;
  const sc = Math.min(1, Math.min(W*0.72/rw, H*0.5/rh));
  const ox = (W-rw*sc)/2;
  const oy = (H-rh*sc)/2 + H*0.08;
  ctx.save();
  ctx.translate(ox,oy); ctx.scale(sc,sc);
  ctx.fillStyle = '#1a2029';
  ctx.fillRect(0,0,rw,rh);
  const wallSet = new Set();
  for(let y = 0; y < demo.h; y++){
    for(let x = 0; x < demo.w; x++){
      const terr = demo.terrain[y][x];
      const border = isBorder(demo, x, y);
      if((terr && terr.t === 'wall') || border) wallSet.add(x+','+y);
    }
  }
  for(let y = 0; y < demo.h; y++){
    for(let x = 0; x < demo.w; x++){
      const px = x*CELL, py = y*CELL;
      const border = isBorder(demo, x, y);
      const terr = demo.terrain[y][x];
      if(border){}
      else if(!terr) drawFloor(ctx,px,py,CELL,x,y,wallSet);
      else if(terr.t === 'wall'){}
      else if(terr.t === 'target') drawTarget(ctx,px,py,CELL,terr.color);
      else drawFloor(ctx,px,py,CELL,x,y,wallSet);
    }
  }
  for(let y = 0; y < demo.h; y++){
    for(let x = 0; x < demo.w; x++){
      const px = x*CELL, py = y*CELL;
      const border = isBorder(demo, x, y);
      const terr = demo.terrain[y][x];
      if(border || (terr && terr.t === 'wall')) drawWall(ctx,px,py,CELL,wallSet,x,y);
    }
  }
  for(let y = 0; y < demo.h; y++){
    for(let x = 0; x < demo.w; x++){
      const o = demo.objects[y][x];
      if(!o) continue;
      const px = x*CELL, py = y*CELL;
      if(o.o === 'box') drawBox(ctx,px,py,CELL,o.color);
    }
  }
  const bob = Math.sin(t*2)*3;
  drawBox(ctx, 4*CELL, 3*CELL + bob, CELL, 'white', {eyes:true, facing:'right'});
  ctx.restore();
}

function drawHubIcon(c, action, cx, cy, sz) {
  c.save();
  c.lineJoin = 'round';
  c.lineCap = 'round';
  c.strokeStyle = '#0a0600';
  c.fillStyle = '#f5ecd5';
  c.lineWidth = Math.max(3, sz * 0.16);

  if (action === 'start') {
    // 播放三角
    c.beginPath();
    c.moveTo(cx - sz * 0.35, cy - sz * 0.55);
    c.lineTo(cx + sz * 0.55, cy);
    c.lineTo(cx - sz * 0.35, cy + sz * 0.55);
    c.closePath();
    c.stroke();
    c.fill();
  } else if (action === 'howto') {
    // 问号
    c.beginPath();
    c.arc(cx, cy - sz * 0.15, sz * 0.32, Math.PI * 1.15, Math.PI * 2.15);
    c.stroke();
    c.beginPath();
    c.moveTo(cx + sz * 0.30, cy - sz * 0.15);
    c.lineTo(cx + sz * 0.30, cy + sz * 0.10);
    c.quadraticCurveTo(cx + sz * 0.30, cy + sz * 0.35, cx, cy + sz * 0.35);
    c.lineTo(cx, cy + sz * 0.42);
    c.stroke();
    c.beginPath();
    c.arc(cx, cy + sz * 0.65, sz * 0.09, 0, Math.PI * 2);
    c.fillStyle = '#0a0600';
    c.fill();
  } else if (action === 'settings') {
    // 齿轮
    const teeth = 8;
    c.beginPath();
    for (let i = 0; i < teeth; i++) {
      const a0 = (i / teeth) * Math.PI * 2;
      const a1 = a0 + Math.PI / teeth * 0.55;
      const a2 = a0 + Math.PI / teeth * 1.45;
      const a3 = a0 + Math.PI / teeth * 2;
      const r1 = sz * 0.34;
      const r2 = sz * 0.52;
      if (i === 0) {
        c.moveTo(cx + Math.cos(a0) * r1, cy + Math.sin(a0) * r1);
      } else {
        c.lineTo(cx + Math.cos(a0) * r1, cy + Math.sin(a0) * r1);
      }
      c.lineTo(cx + Math.cos(a1) * r2, cy + Math.sin(a1) * r2);
      c.lineTo(cx + Math.cos(a2) * r2, cy + Math.sin(a2) * r2);
      c.lineTo(cx + Math.cos(a3) * r1, cy + Math.sin(a3) * r1);
    }
    c.closePath();
    c.stroke();
    c.fill();
    c.beginPath();
    c.arc(cx, cy, sz * 0.15, 0, Math.PI * 2);
    c.fillStyle = '#0a0600';
    c.fill();
  } else if (action === 'quit') {
    // 门 + 右箭头
    c.strokeRect(cx - sz * 0.55, cy - sz * 0.45, sz * 0.55, sz * 0.9);
    c.beginPath();
    c.moveTo(cx - sz * 0.10, cy);
    c.lineTo(cx + sz * 0.52, cy);
    c.moveTo(cx + sz * 0.32, cy - sz * 0.22);
    c.lineTo(cx + sz * 0.52, cy);
    c.lineTo(cx + sz * 0.32, cy + sz * 0.22);
    c.stroke();
  }
  c.restore();
}

function renderHub(t){
  const W = canvas.width / dpr, H = canvas.height / dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  Starfield.update(W,H,1/60);
  Starfield.draw(ctx, W, H, t, 0, 0);
  const gs = Math.min(W*0.72, H*0.72, 540);
  const cell = gs/6;
  const ox = (W-gs)/2, oy = (H-gs)/2;
  hub.display.x += (hub.player.x-hub.display.x)*0.25;
  hub.display.y += (hub.player.y-hub.display.y)*0.25;
  const px = ox+(hub.display.x+0.5)*cell;
  const py = oy+(hub.display.y+0.5)*cell;
  const el = (performance.now()-hub.startTime)/1000;
  const rt = Math.min(1, el/1.2);
  const revR = (1-Math.pow(1-rt,3)) * Math.max(W,H) * 1.2;
  ctx.save();
  ctx.beginPath();
  ctx.arc(W/2,H/2,revR,0,Math.PI*2);
  ctx.clip();
  for(let y = 0; y < 6; y++){
    for(let x = 0; x < 6; x++){
      drawFloor(ctx, ox+x*cell, oy+y*cell, cell, x, y, null);
    }
  }
  for(let x = 0; x < 6; x++){
    drawWall(ctx, ox+x*cell, oy-cell, cell, null, x, -1);
    drawWall(ctx, ox+x*cell, oy+6*cell, cell, null, x, 6);
  }
  for(let y = 0; y < 6; y++){
    drawWall(ctx, ox-cell, oy+y*cell, cell, null, -1, y);
    drawWall(ctx, ox+6*cell, oy+y*cell, cell, null, 6, y);
  }
  const HUB_COLOR = {start:'green', howto:'blue', settings:'orange', quit:'red'};
  HUB_TARGETS.forEach(tg => {
    drawTarget(ctx, ox+tg.x*cell, oy+tg.y*cell, cell, HUB_COLOR[tg.action] || 'white');
  });
  HUB_TARGETS.forEach(tg => {
    drawHubIcon(ctx, tg.action, ox+(tg.x+0.5)*cell, oy+(tg.y+0.5)*cell, cell*0.42);
  });
  const psz = cell*0.95;
  drawBox(ctx, px-psz/2, py-psz/2, psz, 'white', {eyes:true, facing: hub.facing || 'down'});
  ctx.restore();
  ctx.save();
  ctx.font = '12px "Courier New", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillStyle = 'rgba(170,196,214,0.6)';
  ctx.shadowBlur = 4; ctx.shadowColor = '#000';
  ctx.fillText(window.t('hub.help'), W/2, H-20);
  ctx.restore();
}

function renderGame(t){
  const W = canvas.width / dpr, H = canvas.height / dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  Starfield.update(W,H,1/60);
  let bgX = 0, bgY = 0;
  if(G.transition && G.transition.active){
    const tr = G.transition;
    const p = Math.min(1, tr.t/tr.duration);
    const e = p<0.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2;
    if(tr.dir === 'right') bgX = -260*e;
    else if(tr.dir === 'left') bgX = 260*e;
    else if(tr.dir === 'down') bgY = -260*e;
    else if(tr.dir === 'up') bgY = 260*e;
  }
  Starfield.draw(ctx, W, H, t, bgX, bgY);
  if(!G.level) return;
  if(G.transition && G.transition.active){ renderTrans(W,H,t); return; }
  const room = getRoomP(G.roomId); if(!room) return;
  const rw = room.w*CELL, rh = room.h*CELL;
  const sc = Math.min(1, Math.min((W-40)/rw, (H-40)/rh));
  const ox = (W-rw*sc)/2, oy = (H-rh*sc)/2;
  ctx.save();
  ctx.translate(ox,oy); ctx.scale(sc,sc);
  drawRoomScene(room, G.head, G.path, G.bodyColors, G.facing, t);
  ctx.restore();
}
function renderTrans(W,H,t){
  const tr = G.transition;
  const p = Math.min(1, tr.t/tr.duration);
  const e = p<0.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2;
  const fr = getRoomP(tr.fromRoom), toR = getRoomP(tr.toRoom);
  if(!fr || !toR){ tr.active = false; return; }
  const fW = fr.w*CELL, fH = fr.h*CELL, tW = toR.w*CELL, tH = toR.h*CELL;
  const fB = Math.min(1, Math.min((W-40)/fW, (H-40)/fH));
  const tB = Math.min(1, Math.min((W-40)/tW, (H-40)/tH));
  let sx = 0, sy = 0;
  if(tr.dir === 'right') sx = 1;
  else if(tr.dir === 'left') sx = -1;
  else if(tr.dir === 'down') sy = 1;
  else if(tr.dir === 'up') sy = -1;
  const oS = fB*(1-0.18*e), oX = W/2-sx*W*0.95*e, oY = H/2-sy*H*0.95*e, oA = 1-e;
  const nS = tB*(1.20-0.20*e), nX = W/2+sx*W*0.95*(1-e), nY = H/2+sy*H*0.95*(1-e), nA = e;
  if(oA > 0.01){
    ctx.save(); ctx.globalAlpha = oA;
    ctx.translate(oX,oY); ctx.scale(oS,oS); ctx.translate(-fW/2,-fH/2);
    drawRoomScene(fr, G.head, G.path, G.bodyColors, G.facing, t);
    ctx.restore();
  }
  if(nA > 0.01){
    ctx.save(); ctx.globalAlpha = nA;
    ctx.translate(nX,nY); ctx.scale(nS,nS); ctx.translate(-tW/2,-tH/2);
    drawRoomScene(toR, G.head, G.path, G.bodyColors, G.facing, t);
    ctx.restore();
  }
}
function drawRoomScene(room, headState, pathState, bodyColors, facing, now){
  const wallSet = new Set();
  for(let y = 0; y < room.h; y++){
    for(let x = 0; x < room.w; x++){
      const t = room.terrain[y][x];
      const b = isBorder(room,x,y);
      const p = b && isPassage(G.level, room, x, y);
      if((t && t.t === 'wall') || (b && !p)) wallSet.add(x+','+y);
    }
  }
  for(let y = 0; y < room.h; y++){
    for(let x = 0; x < room.w; x++){
      const px = x*CELL, py = y*CELL;
      const b = isBorder(room,x,y);
      const p = b && isPassage(G.level, room, x, y);
      const t = room.terrain[y][x];
      if(b && !p){}
      else if(p) drawFloor(ctx,px,py,CELL,x,y,wallSet);
      else if(!t) drawFloor(ctx,px,py,CELL,x,y,wallSet);
      else if(t.t === 'wall'){}
      else if(t.t === 'target') drawTarget(ctx,px,py,CELL,t.color);
      else if(t.t === 'door'){
        const k = room.id+','+x+','+y;
        const o = getDoorOpen(room,x,y);
        const tg = o?1:0;
        if(G.doorAnim[k] === undefined) G.doorAnim[k] = tg;
        G.doorAnim[k] += (tg-G.doorAnim[k])*0.2;
        drawDoor(ctx,px,py,CELL,t.n,G.doorAnim[k]);
      }
      else if(t.t === 'crumble'){
        if(t.n <= 0) drawPit(ctx,px,py,CELL);
        else drawCrumbleBricks(ctx,px,py,CELL);
      }
      else drawFloor(ctx,px,py,CELL,x,y,wallSet);
    }
  }
  for(let y = 0; y < room.h; y++){
    for(let x = 0; x < room.w; x++){
      const px = x*CELL, py = y*CELL;
      const b = isBorder(room,x,y);
      const p = b && isPassage(G.level, room, x, y);
      const t = room.terrain[y][x];
      if((b && !p) || (t && t.t === 'wall')) drawWall(ctx,px,py,CELL,wallSet,x,y);
    }
  }
  for(let y = 0; y < room.h; y++){
    for(let x = 0; x < room.w; x++){
      const px = x*CELL, py = y*CELL;
      const o = room.objects[y][x]; if(!o) continue;
      if(o.o === 'bean') drawBean(ctx,px,py,CELL,o.color,now);
      else if(o.o === 'box') drawBox(ctx,px,py,CELL,o.color);
      else if(o.o === 'bomb') drawBomb(ctx,px,py,CELL,now);
      else if(o.o === 'portal'){
        drawPortal(ctx,px,py,CELL,o.color,now);
        if(o.coveredBox) drawBox(ctx,px,py,CELL,o.coveredBox.color);
      }
    }
  }
  const startIdx = pathState.length-1-bodyColors.length;
  const cm = new Map();
  for(let k = Math.max(0, startIdx); k < pathState.length; k++){
    const pp = pathState[k];
    if(pp.roomId !== room.id) continue;
    const _t = room.terrain[pp.y] && room.terrain[pp.y][pp.x];
    if(_t && _t.t === 'crumble' && _t.n <= 0) continue;
    cm.set(pp.x+','+pp.y, k);
  }
  const isNb = (a,b) => { if(!cm.has(a) || !cm.has(b)) return false; return Math.abs(cm.get(a)-cm.get(b)) === 1; };
  if(cm.size > 0){
    ctx.save();
    ctx.strokeStyle = '#ff3344'; ctx.lineWidth = 3;
    ctx.lineCap = 'butt'; ctx.lineJoin = 'round';
    ctx.shadowBlur = 8; ctx.shadowColor = 'rgba(255,51,68,0.7)';
    ctx.beginPath();
    for(const [key] of cm){
      const [cx2, cy2] = key.split(',').map(Number);
      const lx = cx2*CELL, ly = cy2*CELL, rx = lx+CELL, by = ly+CELL;
      if(!isNb(key, cx2+','+(cy2-1))){ ctx.moveTo(lx,ly); ctx.lineTo(rx,ly); }
      if(!isNb(key, cx2+','+(cy2+1))){ ctx.moveTo(lx,by); ctx.lineTo(rx,by); }
      if(!isNb(key, (cx2-1)+','+cy2)){ ctx.moveTo(lx,ly); ctx.lineTo(lx,by); }
      if(!isNb(key, (cx2+1)+','+cy2)){ ctx.moveTo(rx,ly); ctx.lineTo(rx,by); }
    }
    ctx.stroke(); ctx.restore();
  }
  for(let k = bodyColors.length; k >= 1; k--){
    const idx = pathState.length-1-k;
    if(idx < 0) continue;
    const pp = pathState[idx];
    if(pp.roomId !== room.id) continue;
    const _t = room.terrain[pp.y] && room.terrain[pp.y][pp.x];
    if(_t && _t.t === 'crumble' && _t.n <= 0) continue;
    drawBox(ctx,pp.x*CELL,pp.y*CELL,CELL,bodyColors[k-1]);
  }
  if(headState.roomId === room.id){
    drawBox(ctx,headState.x*CELL,headState.y*CELL,CELL,'white',{eyes:true, facing});
  }
  for(let y = 0; y < room.h; y++){
    for(let x = 0; x < room.w; x++){
      const t2 = room.terrain[y][x];
      if(t2 && t2.t === 'crumble' && t2.n > 0) drawCrumbleNumber(ctx,x*CELL,y*CELL,CELL,t2.n);
    }
  }
  drawEffects(ctx, room.id, now);
}

function loop(t){
  try { if (window.GamepadManager && window.GamepadManager.poll) window.GamepadManager.poll(); } catch(e){}
  if(G.screen === 'title'){
  } else if(G.screen === 'hub'){
    renderHub(t/1000);
  } else if(G.screen === 'playing'){
    if(!G.paused){
      updateEffects(1/60);
      if(G.pendingDeath){
        G.deathDelay -= 1/60;
        if(G.deathDelay <= 0){
          G.pendingDeath = false; G.dead = true;
          if(!G.win){
            AUDIO.sfxLose();
            setTimeout(() => $('#loseModal').classList.add('active'), 100);
          }
        }
      }
      if(G.transition && G.transition.active){
        G.transition.t += 1/60;
        if(G.transition.t >= G.transition.duration) G.transition.active = false;
      }
    }
    renderGame(t/1000);
  }
  renderCRT(t);
  requestAnimationFrame(loop);
}

function makeThumb(lv, size){
  const cv = document.createElement('canvas');
  cv.width = size; cv.height = size;
  const c = cv.getContext('2d');
  c.fillStyle = '#060810'; c.fillRect(0,0,size,size);
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  lv.rooms.forEach(room => {
    const lay = getLayout(lv, room.id); if(!lay) return;
    minX = Math.min(minX, lay.x); minY = Math.min(minY, lay.y);
    maxX = Math.max(maxX, lay.x+room.w*CELL); maxY = Math.max(maxY, lay.y+room.h*CELL);
  });
  if(!isFinite(minX)) return cv.toDataURL();
  const ww = maxX-minX, wh = maxY-minY;
  const sc = Math.min((size-8)/ww, (size-8)/wh);
  const ox = (size-ww*sc)/2-minX*sc, oy = (size-wh*sc)/2-minY*sc;
  lv.rooms.forEach(room => {
    const lay = getLayout(lv, room.id); if(!lay) return;
    c.fillStyle = '#3a4150';
    c.fillRect(ox+lay.x*sc,oy+lay.y*sc,room.w*CELL*sc,room.h*CELL*sc);
    c.strokeStyle = '#00ffaa'; c.lineWidth = 1;
    c.strokeRect(ox+lay.x*sc+0.5,oy+lay.y*sc+0.5,room.w*CELL*sc-1,room.h*CELL*sc-1);
    for(let y = 0; y < room.h; y++){
      for(let x = 0; x < room.w; x++){
        const t = room.terrain[y][x];
        if(t && t.t === 'target'){
          c.fillStyle = COLOR_HEX[t.color] || '#fff';
          c.fillRect(ox+(lay.x+x*CELL)*sc+1,oy+(lay.y+y*CELL)*sc+1,Math.max(2,CELL*sc-2),Math.max(2,CELL*sc-2));
        }
      }
    }
  });
  return cv.toDataURL();
}

function openLevelSelect(){
  const grid = $('#levelGrid');
  grid.innerHTML = '';
  if(!LEVELS.levels || LEVELS.levels.length === 0){
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#7a8a9a;padding:40px;font-size:14px">' + window.t('level.empty') + '<br><span style="font-size:12px;color:#4a5a6a;display:inline-block;margin-top:8px">' + window.t('level.emptyHint') + '</span></div>';
    $('#levelSelectModal').classList.add('active');
    return;
  }
  const unlocked = Save.data.unlocked || 1;
  LEVELS.levels.forEach((lv, idx) => {
    const card = document.createElement('div');
    card.className = 'level-card' + (idx >= unlocked ? ' locked' : '');
    const best = Save.data.bestSteps[idx];
    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    if(idx < unlocked){
      const img = document.createElement('img');
      img.src = makeThumb(lv, 200);
      thumb.appendChild(img);
    } else thumb.innerHTML = '<div class="lock">🔒</div>';
    const info = document.createElement('div');
    info.className = 'info';
    info.innerHTML = `<div class="id">${window.t('level.n')} ${idx+1}</div>` + (idx < unlocked
      ? `<div class="best">${window.t('level.best')}: ${best !== undefined ? '<b>'+best+'</b>' : '—'}</div>`
      : `<div class="best">${window.t('level.unlocked')}</div>`);
    card.appendChild(thumb); card.appendChild(info);
    if(idx < unlocked){
      card.onclick = () => { AUDIO.sfxClick(); $('#levelSelectModal').classList.remove('active'); startLevel(idx); };
    }
    grid.appendChild(card);
  });
  $('#levelSelectModal').classList.add('active');
}
